name: Build Android APK - Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK Diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare logs folder
        run: mkdir -p build_logs

      - name: Flutter doctor
        run: |
          flutter doctor -v 2>&1 | tee build_logs/01_flutter_doctor.txt
        continue-on-error: true

      - name: Flutter version
        run: |
          flutter --version 2>&1 | tee build_logs/02_flutter_version.txt
        continue-on-error: true

      - name: Create Android project files
        run: |
          flutter create --platforms android --no-pub . 2>&1 | tee build_logs/03_flutter_create_android.txt
        continue-on-error: true

      - name: Get packages
        run: |
          flutter pub get 2>&1 | tee build_logs/04_pub_get.txt

      - name: Show dependency tree
        run: |
          flutter pub deps 2>&1 | tee build_logs/05_pub_deps.txt
        continue-on-error: true

      - name: Patch qr_code_scanner for AGP 8 and Kotlin JVM 1.8
        run: |
          set +e

          QR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/qr_code_scanner-1.0.1/android/build.gradle"

          echo "Checking qr_code_scanner Gradle file..."
          echo "Path: $QR_GRADLE"

          if [ -f "$QR_GRADLE" ]; then
            echo "Found qr_code_scanner build.gradle"

            if ! grep -q "namespace" "$QR_GRADLE"; then
              sed -i "/android {/a\\    namespace \"net.touchcapture.qr.flutterqr\"" "$QR_GRADLE"
            fi

            if ! grep -q "compileOptions" "$QR_GRADLE"; then
              sed -i "/android {/a\\    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_1_8\\n        targetCompatibility JavaVersion.VERSION_1_8\\n    }" "$QR_GRADLE"
            fi

            if ! grep -q "kotlinOptions" "$QR_GRADLE"; then
              cat >> "$QR_GRADLE" <<'EOF'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
EOF
            fi

            echo "----- qr_code_scanner build.gradle after patch -----"
            cat "$QR_GRADLE"
          else
            echo "qr_code_scanner build.gradle not found"
          fi
        continue-on-error: true

      - name: Enable core library desugaring for app
        run: |
          set +e

          APP_GRADLE_KTS="android/app/build.gradle.kts"

          if [ -f "$APP_GRADLE_KTS" ]; then
            echo "Found Kotlin Gradle file: $APP_GRADLE_KTS"

            if ! grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE_KTS"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE_KTS"
            fi

            if ! grep -q "desugar_jdk_libs" "$APP_GRADLE_KTS"; then
              sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' "$APP_GRADLE_KTS"
            fi

            echo "----- android/app/build.gradle.kts after patch -----"
            cat "$APP_GRADLE_KTS"
          else
            echo "android/app/build.gradle.kts not found"
          fi
        continue-on-error: true

      - name: Analyze Dart code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee build_logs/06_flutter_analyze.txt
        continue-on-error: true

      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean --stacktrace --warning-mode all 2>&1 | tee ../build_logs/07_gradle_clean.txt
          cd ..
        continue-on-error: true

      - name: Gradle dependencies check
        run: |
          cd android
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath --stacktrace 2>&1 | tee ../build_logs/08_gradle_dependencies.txt
          cd ..
        continue-on-error: true

      - name: Build release APK with full logs
        run: |
          flutter build apk --release --verbose 2>&1 | tee build_logs/09_flutter_build_apk_verbose.txt

      - name: Copy APK to output
        if: success()
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/offline-barcode-cashier.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-barcode-cashier-apk
          path: output/offline-barcode-cashier.apk

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-build-logs
          path: build_logs/
