name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          java -version
          flutter --version

      - name: Create Android files
        run: flutter create --platforms=android --no-pub .

      - name: Get packages
        run: flutter pub get

      - name: Set Android minSdk and manifest
        shell: bash
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9][0-9]*/minSdk = 23/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 23/g' android/app/build.gradle
          fi
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <application android:label="كاشير باركود" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:taskAffinity="" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST

      - name: Patch qr_code_scanner namespace
        shell: bash
        run: |
          set -e
          echo "Workflow v1.0.10 is running"
          QR_DIR=$(find "$HOME/.pub-cache" -type d -path "*/qr_code_scanner-*/android" | head -n 1)
          echo "QR_DIR=$QR_DIR"
          if [ -z "$QR_DIR" ]; then
            echo "qr_code_scanner android folder not found"
            exit 1
          fi
          if [ -f "$QR_DIR/build.gradle" ]; then
            python3 - "$QR_DIR/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'namespace ' not in s:
              s = s.replace('android {', 'android {\n    namespace "net.touchcapture.qr.flutterqr"', 1)
          p.write_text(s)
          print(p.read_text()[:800])
          PY
          fi
          if [ -f "$QR_DIR/build.gradle.kts" ]; then
            python3 - "$QR_DIR/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'namespace' not in s:
              s = s.replace('android {', 'android {\n    namespace = "net.touchcapture.qr.flutterqr"', 1)
          p.write_text(s)
          print(p.read_text()[:800])
          PY
          fi

      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --stacktrace

      - name: Analyze non blocking
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-barcode-cashier-apk
          path: build/app/outputs/flutter-apk/app-release.apk
