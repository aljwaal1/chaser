name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms android --no-pub .

      - name: Get packages
        run: flutter pub get

      - name: Patch qr_code_scanner
        run: |
          QR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/qr_code_scanner-1.0.1/android/build.gradle"

          if [ -f "$QR_GRADLE" ]; then
            echo "Patching qr_code_scanner..."

            if ! grep -q "namespace" "$QR_GRADLE"; then
              sed -i '/android {/a\    namespace "net.touchcapture.qr.flutterqr"' "$QR_GRADLE"
            fi

            if ! grep -q "compileOptions" "$QR_GRADLE"; then
              sed -i '/android {/a\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }' "$QR_GRADLE"
            fi

            cat >> "$QR_GRADLE" <<'EOF'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
EOF

            cat "$QR_GRADLE"
          else
            echo "qr_code_scanner build.gradle not found"
          fi

      - name: Enable core library desugaring
        run: |
          APP_GRADLE="android/app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then
            echo "Patching app Gradle..."

            if ! grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE"
            fi

            if ! grep -q "desugar_jdk_libs" "$APP_GRADLE"; then
              sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' "$APP_GRADLE"
            fi

            cat "$APP_GRADLE"
          else
            echo "android/app/build.gradle.kts not found"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean --stacktrace
          cd ..

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Copy APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/offline-barcode-cashier.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-barcode-cashier-apk
          path: output/offline-barcode-cashier.apk
